version: "3.8"

services:
  chat-server:
    build: .
    container_name: chat-server
    ports:
      - "0.0.0.0:5500:5500" # Bind to all interfaces (accessible via VM IP)
    volumes:
      # Persist database on host
      - ./database:/app/database
      - ./src:/app/src # Mount source code
    restart: unless-stopped
    stdin_open: true
    tty: true
